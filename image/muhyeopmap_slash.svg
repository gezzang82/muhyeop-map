<svg width="220" height="110" viewBox="-40 -30 220 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --text-fill: #ffffff; --cut: #ffffff; }
    .piece { fill: var(--text-fill); transform-box: fill-box; transform-origin: center; will-change: transform; }
    .top-piece { clip-path: url(#cutTop); animation: splitTop 2.15s cubic-bezier(.16,1,.3,1) 1 forwards; }
    .bottom-piece { clip-path: url(#cutBottom); animation: splitBottom 2.15s cubic-bezier(.16,1,.3,1) 1 forwards; }
    .slash-flash { fill: var(--cut); opacity: 0; filter: url(#bladeGlow); transform-box: fill-box; transform-origin: center; animation: singleSlash 2.15s cubic-bezier(.16,1,.3,1) 1 forwards; }
    .shard { fill: var(--cut); opacity: 0; filter: url(#bladeGlow); transform-box: fill-box; transform-origin: center; animation: shardFly 2.15s ease-out 1 forwards; }
    .s1 { animation-delay: .10s; }
    .s2 { animation-delay: .14s; }
    .s3 { animation-delay: .18s; }

    @keyframes singleSlash {
      0%, 19% { opacity: 0; transform: scaleX(.28) scaleY(.65); }
      24% { opacity: .98; transform: scaleX(1.03) scaleY(1); }
      30%, 100% { opacity: 0; transform: scaleX(1.18) scaleY(.72); }
    }
    /* 최초 버전의 자연스러운 타이밍 유지 + 움직임만 좌/우 슬라이드 */
    @keyframes splitTop {
      0%, 30% { transform: translate3d(0,0,0) rotate(0); opacity: 1; }
      100% { transform: translate3d(-10px,-3px,0) rotate(-0.8deg); opacity: 1; }
    }
    @keyframes splitBottom {
      0%, 30% { transform: translate3d(0,0,0) rotate(0); opacity: 1; }
      100% { transform: translate3d(10px,3px,0) rotate(0.8deg); opacity: 1; }
    }
    @keyframes shardFly {
      0%, 23% { opacity: 0; transform: translate3d(0,0,0) scale(.7); }
      31% { opacity: .62; transform: translate3d(1px,-1px,0) scale(1); }
      55%, 100% { opacity: 0; transform: translate3d(7px,-6px,0) scale(.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .top-piece, .bottom-piece, .slash-flash, .shard { animation: none; }
    }
  </style>
  <defs>
    <filter id="bladeGlow" x="-80%" y="-120%" width="260%" height="340%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cutTop" clipPathUnits="userSpaceOnUse">
      <polygon points="-80,-80 220,-80 220,-13.49 -80,59.49"/>
    </clipPath>
    <clipPath id="cutBottom" clipPathUnits="userSpaceOnUse">
      <polygon points="-80,59.49 220,-13.49 220,130 -80,130"/>
    </clipPath>
