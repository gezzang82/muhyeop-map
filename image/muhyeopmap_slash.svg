  </defs>
  <use href="#textPath" class="piece top-piece"/>
  <use href="#textPath" class="piece bottom-piece"/>
  <polygon class="slash-flash" points="-4.00,41.00 9.10,39.87 131.84,10.02 144.00,5.00 130.90,6.13 8.16,35.98"/>
  <polygon class="shard s1" points="52,27 58,25 55,29"/>
  <polygon class="shard s2" points="88,18 95,16 91,21"/>
  <polygon class="shard s3" points="114,12 119,10 117,15"/>
</svg>
